name: Build Starfold tvOS SDR matching

'on':
  push:
    paths:
      - '.github/workflows/build-starfold-tvos-hdr.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check Metal toolchain
        shell: bash
        run: |
          if ! xcrun --sdk appletvos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
